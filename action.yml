name: "Storybook VRT (green/red diff)"
description: "Self-hosted Chromatic-like VRT for Storybook: storycap capture + pixelmatch 緑/赤 diff + PR inline comment."
author: "sgash708"
branding:
  icon: "eye"
  color: "green"

inputs:
  github-token:
    description: "GITHUB_TOKEN。PR コメント投稿と baseline/report ブランチ push に使う。"
    required: true
  storybook-static-path:
    description: "ビルド済み Storybook 静的ディレクトリ。"
    required: false
    default: "storybook-static"
  viewport:
    description: "撮影ビューポート WxH。カンマ区切りで複数指定可(例: 390x844,1280x800)。複数指定時のみファイル名に _WxH サフィックスが付く(単一指定時は従来通り)。"
    required: false
    default: "390x844"
  port:
    description: "storybook-static を配信するローカルポート。"
    required: false
    default: "6006"
  matching-threshold:
    description: "pixelmatch の matching threshold(0-1)。小さいほど敏感。"
    required: false
    default: "0.05"
  threshold-pixel:
    description: "この変化ピクセル数を超えたら story を『変更』とみなす。"
    required: false
    default: "50"
  baseline-branch:
    description: "ベースライン画像を保持するブランチ(デフォルトブランチへの push 時に更新)。"
    required: false
    default: "vrt-baseline"
  report-branch:
    description: "PR コメント用に actual/expected/diff をホストするブランチ。"
    required: false
    default: "vrt-reports"
  install-fonts:
    description: "Noto CJK フォントを入れる(Linux)。日本語を豆腐にしないため。"
    required: false
    default: "true"
  pages-config:
    description: "実ページVRT対象URL一覧の設定ファイル。存在しなければ実ページVRTはスキップされる。"
    required: false
    default: "chromagic.pages.json"
  pages-start-command:
    description: "実ページVRT用にアプリを起動するコマンド。未指定なら実ページVRTはスキップされる。"
    required: false
    default: ""
  pages-base-url:
    description: "起動したアプリへアクセスするベースURL。"
    required: false
    default: "http://localhost:3000"
  pages-login-script:
    description: "ログイン用Playwrightスクリプトのパス。省略時は未ログイン状態でキャプチャする。"
    required: false
    default: ""
  pages-health-check-timeout:
    description: "アプリ起動待ちのタイムアウト秒数。"
    required: false
    default: "30"
  pages-baseline-branch:
    description: "実ページ用ベースライン画像ブランチ。"
    required: false
    default: "vrt-baseline-pages"
  pages-report-branch:
    description: "実ページ用PRコメント画像のホストブランチ。"
    required: false
    default: "vrt-reports-pages"
  pages-viewport:
    description: "実ページVRTのビューポート WxH。省略時は viewport の1つ目の値を使う。"
    required: false
    default: ""
  pages-check-name:
    description: "実ページVRTの承認ゲートに使う check run 名。branch protection の required check にはこの名前を指定する。"
    required: false
    default: "chromagic/pages-approval"

outputs:
  changed:
    description: "差分が出た story 数。"
    value: ${{ steps.chromagic.outputs.changed }}
  new:
    description: "新規 story 数(baseline に無い)。"
    value: ${{ steps.chromagic.outputs.new }}
  deleted:
    description: "削除 story 数(baseline にあり現行に無い)。"
    value: ${{ steps.chromagic.outputs.deleted }}
  pass:
    description: "一致した story 数。"
    value: ${{ steps.chromagic.outputs.pass }}
  total:
    description: "撮影した story 総数。"
    value: ${{ steps.chromagic.outputs.total }}

runs:
  using: "composite"
  steps:
    # fonts-noto-cjk は約61MBあり apt install の大半の時間を占める。
    # /usr/share/fonts, /var/cache/fontconfig は root 所有なので、actions/cache が
    # restore 時に書き込めるよう事前に所有権を runner ユーザーへ渡しておく。
    - name: Prepare fonts cache dir
      if: ${{ inputs.install-fonts == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo mkdir -p /usr/share/fonts/opentype/noto /var/cache/fontconfig
        sudo chown -R "$(id -u):$(id -g)" /usr/share/fonts/opentype/noto /var/cache/fontconfig

    - name: Restore Noto CJK fonts cache
      if: ${{ inputs.install-fonts == 'true' && runner.os == 'Linux' }}
      id: fonts-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /usr/share/fonts/opentype/noto
          /var/cache/fontconfig
        key: chromagic-noto-cjk-${{ runner.os }}

    - name: Install Japanese fonts (Noto CJK)
      if: ${{ inputs.install-fonts == 'true' && runner.os == 'Linux' && steps.fonts-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-noto-cjk
        # apt が root 所有に戻すので、save 前に再度 runner ユーザーへ渡す
        sudo chown -R "$(id -u):$(id -g)" /usr/share/fonts/opentype/noto /var/cache/fontconfig
        fc-cache -f

    - name: Save Noto CJK fonts cache
      if: ${{ inputs.install-fonts == 'true' && runner.os == 'Linux' && steps.fonts-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /usr/share/fonts/opentype/noto
          /var/cache/fontconfig
        key: ${{ steps.fonts-cache.outputs.cache-primary-key }}

    # browser-actions/setup-chrome は RUNNER_TOOL_CACHE 配下にキャッシュする作りだが、
    # GitHub-hosted runner は毎回使い捨て VM なのでジョブをまたいでは残らない。
    # actions/cache で永続化し、2回目以降のダウンロードをスキップする。
    - name: Restore Chrome for Testing cache
      id: chrome-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/setup-chrome
        key: chromagic-chrome-${{ runner.os }}-${{ runner.arch }}

    - name: Setup Chrome for Testing
      id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      with:
        # install-dependencies: true は毎回 apt-get update を走らせ約7秒かかる。
        # GitHub-hosted ubuntu-latest には Chrome 実行に必要な共有ライブラリが
        # 標準で揃っている(実測ログで全依存が already the newest version)ため false にする。
        install-dependencies: false

    - name: Save Chrome for Testing cache
      if: ${{ steps.chrome-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/setup-chrome
        key: ${{ steps.chrome-cache.outputs.cache-primary-key }}

    # action 自体の node_modules(storycap 等)も package-lock.json のハッシュでキャッシュする。
    - name: Restore action dependencies cache
      id: deps-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.action_path }}/node_modules
        key: chromagic-deps-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', github.action_path)) }}

    - name: Install action dependencies
      if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
      shell: bash
      # consumer 側は実行に要る依存だけ(devDeps=semantic-release 等は入れない)。
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --omit=dev --no-audit --no-fund

    - name: Save action dependencies cache
      if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.action_path }}/node_modules
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Capture stories (storycap)
      shell: bash
      # inputs は run ブロックへ直接展開せず env 経由で渡す(shell/式インジェクション対策)。
      env:
        STORYBOOK_STATIC_PATH: ${{ inputs.storybook-static-path }}
        VRT_PORT: ${{ inputs.port }}
        VRT_VIEWPORT: ${{ inputs.viewport }}
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        # viewport はカンマ区切りで複数指定可。storycap の -V を viewport ごとに渡す
        # (storycap は viewport を複数渡すと自動でファイル名に _WxH サフィックスを付ける。
        #  単一指定時は挙動が変わらないので既存 baseline との後方互換性は保たれる)。
        IFS=',' read -ra CHROMAGIC_VIEWPORTS <<< "$VRT_VIEWPORT"
        VIEWPORT_ARGS=()
        for vp in "${CHROMAGIC_VIEWPORTS[@]}"; do
          VIEWPORT_ARGS+=(--viewport "$vp")
        done
        "$GITHUB_ACTION_PATH/node_modules/.bin/storycap" \
          --serverCmd "\"$GITHUB_ACTION_PATH/node_modules/.bin/http-server\" \"$STORYBOOK_STATIC_PATH\" -p $VRT_PORT -s" \
          "http://localhost:$VRT_PORT" \
          -o "$RUNNER_TEMP/vrt-current" \
          "${VIEWPORT_ARGS[@]}" \
          --chromiumPath "$CHROME_PATH"

    - name: Compare & report (pixelmatch 緑/赤)
      id: chromagic
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VRT_CURRENT_DIR: ${{ runner.temp }}/vrt-current
        VRT_BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        VRT_REPORT_BRANCH: ${{ inputs.report-branch }}
        VRT_MATCHING_THRESHOLD: ${{ inputs.matching-threshold }}
        VRT_THRESHOLD_PIXEL: ${{ inputs.threshold-pixel }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"

    - name: Start app for page VRT
      if: ${{ inputs.pages-start-command != '' }}
      shell: bash
      env:
        PAGES_START_COMMAND: ${{ inputs.pages-start-command }}
      run: |
        nohup bash -c "$PAGES_START_COMMAND" > "$RUNNER_TEMP/chromagic-pages-app.log" 2>&1 &
        echo $! > "$RUNNER_TEMP/chromagic-pages-app.pid"

    - name: Capture & compare pages (実ページVRT)
      if: ${{ inputs.pages-start-command != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PAGES_CONFIG_PATH: ${{ inputs.pages-config }}
        PAGES_START_COMMAND: ${{ inputs.pages-start-command }}
        PAGES_BASE_URL: ${{ inputs.pages-base-url }}
        PAGES_LOGIN_SCRIPT: ${{ inputs.pages-login-script }}
        PAGES_HEALTH_CHECK_TIMEOUT: ${{ inputs.pages-health-check-timeout }}
        PAGES_BASELINE_BRANCH: ${{ inputs.pages-baseline-branch }}
        PAGES_REPORT_BRANCH: ${{ inputs.pages-report-branch }}
        PAGES_VIEWPORT: ${{ inputs.pages-viewport }}
        PAGES_CHECK_NAME: ${{ inputs.pages-check-name }}
        VRT_MATCHING_THRESHOLD: ${{ inputs.matching-threshold }}
        VRT_THRESHOLD_PIXEL: ${{ inputs.threshold-pixel }}
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: node "$GITHUB_ACTION_PATH/src/pages-entry.mjs"

    - name: Stop app for page VRT
      if: ${{ always() && inputs.pages-start-command != '' }}
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/chromagic-pages-app.pid" ]; then
          kill "$(cat "$RUNNER_TEMP/chromagic-pages-app.pid")" 2>/dev/null || true
        fi
